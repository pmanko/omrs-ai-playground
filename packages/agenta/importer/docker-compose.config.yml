version: '3.9'

services:
  agenta_db_config:
    image: node:erbium-alpine
    command: sh -c "cd /importer && npm i && node create-agenta-db.js"
    configs:
      - target: /importer/package.json
        source: package.json
      - target: /importer/create-agenta-db.js
        source: create-agenta-db.js
    networks:
      postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_SERVICE: ${POSTGRES_SERVICE}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      AGENTA_POSTGRESQL_DATABASE: ${AGENTA_POSTGRESQL_DATABASE}
      AGENTA_POSTGRESQL_USERNAME: ${AGENTA_POSTGRESQL_USERNAME}
      AGENTA_POSTGRESQL_PASSWORD: ${AGENTA_POSTGRESQL_PASSWORD}
    deploy:
      replicas: 1
      restart_policy:
        condition: none

networks:
  postgres:
    name: postgres_public
    external: true

configs:
  package.json:
    file: ./package.json
    name: agenta_package.json-${package_json_DIGEST:?err}
    labels:
      name: agenta
  create-agenta-db.js:
    file: ./create-agenta-db.js
    name: agenta_create_db.js-${create_db_js_DIGEST:?err}
    labels:
      name: agenta

